<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="LitZentrum Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#2d1654"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="bookGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="340" fill="url(#bg)"/>

  <!-- Subtle decoration: arc suggesting open book -->
  <ellipse cx="280" cy="340" rx="240" ry="100" fill="#2d1654" opacity="0.5"/>

  <!-- Book stack (left icon area) -->
  <!-- Book 1 (bottom) -->
  <rect x="100" y="220" width="200" height="32" rx="4" fill="#6d28d9" opacity="0.9"/>
  <rect x="100" y="220" width="14" height="32" rx="3" fill="#4c1d95"/>
  <!-- Book 2 -->
  <rect x="108" y="188" width="185" height="30" rx="4" fill="url(#bookGrad)"/>
  <rect x="108" y="188" width="12" height="30" rx="3" fill="#5b21b6"/>
  <!-- Book 3 -->
  <rect x="115" y="158" width="170" height="28" rx="4" fill="url(#bookGrad2)"/>
  <rect x="115" y="158" width="11" height="28" rx="3" fill="#6d28d9"/>
  <!-- Open book on top -->
  <path d="M120 110 L220 90 L220 155 L120 155 Z" fill="#8b5cf6"/>
  <path d="M220 90 L320 110 L320 155 L220 155 Z" fill="#a78bfa"/>
  <!-- Book spine -->
  <line x1="220" y1="90" x2="220" y2="155" stroke="#1a0a2e" stroke-width="2"/>
  <!-- Page lines on open book -->
  <line x1="135" y1="110" x2="210" y2="104" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="135" y1="120" x2="210" y2="115" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="135" y1="130" x2="210" y2="126" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="230" y1="104" x2="305" y2="110" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
  <line x1="230" y1="115" x2="305" y2="120" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="230" y1="126" x2="305" y2="130" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>

  <!-- Small magnifier overlay (academic/research) -->
  <circle cx="330" cy="100" r="22" fill="none" stroke="#a78bfa" stroke-width="4"/>
  <line x1="346" y1="116" x2="365" y2="135" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="420" y1="80" x2="420" y2="265" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>

  <!-- Right: Wordmark + Tagline -->
  <text x="460" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="-1">LitZentrum</text>
  <text x="462" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#a78bfa" letter-spacing="1">Local-first Literature Management</text>
  <text x="464" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#94a3b8">PDF · BibTeX · Notes · Quotes · Ollama AI · Python</text>
</svg>
