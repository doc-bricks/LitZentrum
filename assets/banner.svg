<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="LitZentrum - Academic Literature Suite Banner">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;display=swap');
      .brand-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 72px;
      }
      .brand-tagline {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 23px;
        letter-spacing: 1.5px;
      }
      .brand-details {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 15.5px;
        letter-spacing: 0.5px;
      }
      .badge-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 1px;
      }
    </style>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0314" />
      <stop offset="50%" stop-color="#18072b" />
      <stop offset="100%" stop-color="#0a0212" />
    </linearGradient>
    
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="cover1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="cover2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="spine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="spine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="90%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="10%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>

    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.05" />
      <stop offset="95%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.4" />
    </radialGradient>

    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0" />
      <stop offset="20%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="1" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Background patterns -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#a78bfa" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="340" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative background glows -->
  <circle cx="200" cy="170" r="180" fill="#7c3aed" opacity="0.15" filter="url(#glow)" />
  <circle cx="950" cy="170" r="220" fill="#ec4899" opacity="0.08" filter="url(#glow)" />
  <circle cx="550" cy="280" r="150" fill="#4f46e5" opacity="0.1" filter="url(#glow)" />

  <!-- Dotted pattern overlay -->
  <rect width="1200" height="340" fill="url(#dots)" />

  <!-- Background decorative lines -->
  <path d="M-50,260 Q 250,160 550,250 T 1150,240 T 1250,180" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.12" />
  <path d="M-50,100 Q 350,210 650,90 T 1250,130" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.08" />

  <!-- ==================== FOREGROUND SAFE ZONE: x:80..1120 y:60..300 ==================== -->

  <!-- Sparkles / Star Elements (foreground decorations, inside safe zone) -->
  <!-- Sparkle top-left -->
  <path d="M 105,95 L 108,102 L 115,105 L 108,108 L 105,115 L 102,108 L 95,105 L 102,102 Z" fill="#f472b6" opacity="0.8" />
  <!-- Sparkle bottom-left -->
  <path d="M 330,230 L 332,235 L 337,237 L 332,239 L 330,244 L 328,239 L 323,237 L 328,235 Z" fill="#c084fc" opacity="0.7" />
  <!-- Sparkle top-middle -->
  <path d="M 220,70 L 221.5,74 L 225.5,75 L 221.5,76 L 220,80 L 218.5,76 L 214.5,75 L 218.5,74 Z" fill="#a78bfa" opacity="0.9" />

  <!-- Left: Icon/Illustration Group (Books stack, open book, magnifier) -->
  <g filter="url(#shadow)">
    <!-- Book 1 (Bottom) -->
    <g>
      <!-- Base Shadow of bottom book -->
      <rect x="123" y="248" width="214" height="24" rx="4" fill="#000000" opacity="0.4" filter="url(#glow)"/>
      <!-- Book cover -->
      <rect x="120" y="245" width="220" height="28" rx="4" fill="url(#cover1)" />
      <!-- Book pages (white block) -->
      <rect x="135" y="248" width="202" height="22" rx="2" fill="url(#pageGrad)" />
      <!-- Spine cap/border -->
      <rect x="120" y="245" width="18" height="28" rx="4" fill="url(#spine1)" />
      <!-- Page lines details (edge of pages) -->
      <line x1="337" y1="252" x2="337" y2="266" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 1" />
      
      <!-- Bookmark ribbon hanging out -->
      <path d="M 290,264 L 295,290 L 302,285 L 309,290 L 304,264 Z" fill="#f472b6" opacity="0.95" />
    </g>

    <!-- Book 2 (Middle) -->
    <g transform="rotate(-2.5 230 220)">
      <!-- Book cover -->
      <rect x="135" y="208" width="195" height="26" rx="4" fill="url(#cover2)" />
      <!-- Book pages -->
      <rect x="148" y="211" width="179" height="20" rx="2" fill="url(#pageGrad)" />
      <!-- Spine cap -->
      <rect x="135" y="208" width="16" height="26" rx="4" fill="url(#spine2)" />
      <!-- Page lines details -->
      <line x1="327" y1="214" x2="327" y2="228" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 1" />
    </g>

    <!-- Book 3 (Top, Open Book) -->
    <g>
      <!-- Subtle float shadow under the open book -->
      <path d="M 130,205 C 170,185 290,185 330,205 C 290,212 170,212 130,205 Z" fill="#000000" opacity="0.3" filter="url(#glow)" />
      
      <!-- Hardback Cover (underneath pages) -->
      <path d="M 230,126 C 200,106 158,116 127,141 L 127,203 C 158,178 200,168 230,188 Z" fill="#3b0764" />
      <path d="M 230,126 C 260,106 302,116 333,141 L 333,203 C 302,178 260,168 230,188 Z" fill="#3b0764" />
      
      <!-- Back Page Shadow/Layers -->
      <path d="M 230,123 C 200,103 160,113 130,138 L 130,198 C 160,173 200,163 230,183 Z" fill="#ddd6fe" />
      <path d="M 230,123 C 260,103 300,113 330,138 L 330,198 C 300,173 260,163 230,183 Z" fill="#ddd6fe" />
      
      <!-- Front Top Page Left -->
      <path d="M 230,120 C 200,100 160,110 130,135 L 130,195 C 160,170 200,160 230,180 Z" fill="url(#pageGrad)" />
      
      <!-- Front Top Page Right -->
      <path d="M 230,120 C 260,100 300,110 330,135 L 330,195 C 300,170 260,160 230,180 Z" fill="url(#pageGradRight)" />

      <!-- Spine center shadow line -->
      <path d="M 230,120 L 230,180" stroke="#c4b5fd" stroke-width="1.5" />
      <path d="M 229.5,120 L 229.5,180" stroke="#000" stroke-width="0.75" opacity="0.15" />
      
      <!-- Page Lines (Left Page) -->
      <!-- Accent Header line -->
      <path d="M 150,132 C 170,122 195,122 212,129" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Regular content lines -->
      <path d="M 148,143 C 168,133 195,133 212,140" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
      <path d="M 148,153 C 168,143 195,143 212,150" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
      <path d="M 148,163 C 168,153 195,153 212,160" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
      <path d="M 148,173 C 168,163 195,163 212,170" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />

      <!-- Page Lines (Right Page) -->
      <!-- Accent Header line -->
      <path d="M 248,129 C 265,122 290,122 310,132" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Regular content lines -->
      <path d="M 248,140 C 265,133 292,133 312,143" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
      <path d="M 248,150 C 265,143 292,143 312,153" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
      <path d="M 248,160 C 265,153 292,153 312,163" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
      <path d="M 248,170 C 265,163 292,163 312,173" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>

    <!-- Floating Magnifier -->
    <g>
      <!-- Shadow for the magnifier lens and handle -->
      <circle cx="282" cy="122" r="24" fill="#000000" opacity="0.25" filter="url(#soft-shadow)" />
      <line x1="299" y1="139" x2="322" y2="162" stroke="#000000" stroke-width="6" stroke-linecap="round" opacity="0.25" />
      
      <!-- Magnifier Glass/Lens area -->
      <circle cx="280" cy="120" r="24" fill="url(#lensGrad)" stroke="#c084fc" stroke-width="3.5" />
      
      <!-- Magnifier Glass Reflection Highlight -->
      <path d="M 264,112 C 268,104 278,100 286,102 C 278,104 270,110 268,118 Z" fill="#ffffff" opacity="0.5" />
      
      <!-- Magnifier Handle -->
      <line x1="297" y1="137" x2="320" y2="160" stroke="url(#handleGrad)" stroke-width="5.5" stroke-linecap="round" />
      <!-- Metallic ring connector -->
      <line x1="295" y1="135" x2="299" y2="139" stroke="#e9d5ff" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>

  <!-- Vertical Divider (Glowing Line) -->
  <line x1="420" y1="75" x2="420" y2="265" stroke="url(#dividerGrad)" stroke-width="2" />

  <!-- Right: Branding / Typography Group (Inside safe zone x:460..1120) -->
  <g filter="url(#soft-shadow)">
    <!-- Wordmark -->
    <text x="465" y="156" class="brand-title" fill="#ffffff">Lit<tspan fill="url(#brandGrad)">Zentrum</tspan></text>
    
    <!-- Tagline -->
    <text x="468" y="202" class="brand-tagline" fill="#d8b4fe">Local-First Academic Literature Suite</text>
    
    <!-- Description list -->
    <text x="470" y="238" class="brand-details" fill="#94a3b8">PDF Organizer <tspan fill="#6366f1">•</tspan> BibTeX Sync <tspan fill="#6366f1">•</tspan> AI Notes <tspan fill="#6366f1">•</tspan> Markdown Quotes</text>

    <!-- Badges (Pills) -->
    <!-- Badge 1: AI-Powered -->
    <g transform="translate(470, 264)">
      <rect width="102" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="51" y="15" class="badge-text" fill="#f472b6" text-anchor="middle">AI-POWERED</text>
    </g>
    
    <!-- Badge 2: Local-First -->
    <g transform="translate(584, 264)">
      <rect width="102" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="51" y="15" class="badge-text" fill="#a78bfa" text-anchor="middle">LOCAL-FIRST</text>
    </g>

    <!-- Badge 3: Open Source -->
    <g transform="translate(698, 264)">
      <rect width="102" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="51" y="15" class="badge-text" fill="#818cf8" text-anchor="middle">OPEN SOURCE</text>
    </g>
  </g>
</svg>
