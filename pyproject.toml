[project]
name = "litzentrum-suite"
version = "1.0.0"
description = "Literatur-Verwaltungszentrale mit LaTeX, BibTeX und PDF-Unterstützung"
authors = [{ name = "Lukas Geiger" }]
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"

dependencies = [
    "PySide6>=6.5.0,<7.0.0",
    "QScintilla>=2.14.0,<3.0.0",
    "PyMuPDF>=1.21.0,<2.0.0",
    "bibtexparser>=1.4.0,<2.0.0",
    "python-docx>=0.8.11,<2.0.0",
    "jsonschema>=4.17.0,<5.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.2", "ruff>=0.5", "black>=22.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
